openapi: 3.0.3
info:
  title: Products API
  description: REST CRUD API for managing Product entities.
  version: 1.0.0

servers:
  - url: /
    description: Default server

tags:
  - name: Products
    description: Operations on Product resources
  - name: Auth
    description: Local demo token issuer

security:
  - bearerAuth: []

paths:
  /auth/token:
    post:
      tags:
        - Auth
      summary: Issue a JWT for a demo user (local, non-production token issuer)
      description: Local demo token issuer for assessment usability only.
      operationId: obtainToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /productos:
    get:
      tags:
        - Products
      summary: List all non-deleted products (supports dynamic filtering)
      operationId: productsList
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: false
          description: Exact match on product ID
          schema:
            type: integer
            format: int64
        - name: nombre
          in: query
          required: false
          description: Case-insensitive partial match on product name (contains)
          schema:
            type: string
        - name: descripcion
          in: query
          required: false
          description: Case-insensitive partial match on product description (contains)
          schema:
            type: string
        - name: precioMin
          in: query
          required: false
          description: Inclusive lower bound on base precio
          schema:
            type: number
            format: decimal
        - name: precioMax
          in: query
          required: false
          description: Inclusive upper bound on base precio
          schema:
            type: number
            format: decimal
      responses:
        '200':
          description: List of matching non-deleted products (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Products
      summary: Create a new product
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created successfully
          headers:
            Location:
              description: URI of the newly created product
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /productos/{id}:
    get:
      tags:
        - Products
      summary: Get a product by ID
      operationId: getProductById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique product identifier
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found or soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Products
      summary: Update an existing product
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique product identifier
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Products
      summary: Soft-delete a product
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique product identifier
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Product deleted (soft delete)
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TipoImpuesto:
      type: string
      description: Active tax type
      enum:
        - IVA
        - ITBIS

    AuthRequest:
      type: object
      description: Credentials for the local demo token issuer
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Demo username
          minLength: 1
        password:
          type: string
          description: Demo password
          minLength: 1

    AuthResponse:
      type: object
      description: Issued JWT bearer token
      properties:
        accessToken:
          type: string
          description: Signed JWT access token
        tokenType:
          type: string
          description: Token type
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in seconds

    ProductRequest:
      type: object
      description: Request body for creating or updating a product
      required:
        - nombre
        - precio
      properties:
        nombre:
          type: string
          description: Product name
          minLength: 1
          maxLength: 255
        descripcion:
          type: string
          description: Product description
          maxLength: 1000
        precio:
          type: number
          format: decimal
          description: Base product price
          minimum: 0

    ProductResponse:
      type: object
      description: Product representation including computed tax fields.
      properties:
        id:
          type: integer
          format: int64
          description: Unique product identifier
        nombre:
          type: string
          description: Product name
        descripcion:
          type: string
          description: Product description
          nullable: true
        precio:
          type: number
          format: decimal
          description: Base product price
        tipoImpuesto:
          $ref: '#/components/schemas/TipoImpuesto'
        porcentajeImpuesto:
          type: number
          format: decimal
          description: Active tax rate percentage
        importeImpuesto:
          type: number
          format: decimal
          description: Computed tax amount
        precioConImpuesto:
          type: number
          format: decimal
          description: Total price including tax

    FieldError:
      type: object
      properties:
        field:
          type: string
          description: Name of the field that failed validation
        message:
          type: string
          description: Validation error message

    ErrorResponse:
      type: object
      description: Consistent error response body
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
        status:
          type: integer
          description: HTTP status code
        error:
          type: string
          description: Short error reason
        message:
          type: string
          description: Human-readable error detail
        path:
          type: string
          description: Request path
        fieldErrors:
          type: array
          description: Validation field errors
          items:
            $ref: '#/components/schemas/FieldError'
