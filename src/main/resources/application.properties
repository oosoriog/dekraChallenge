spring.application.name=dekra-challenge

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:dekra_challenge;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging baseline
logging.level.root=INFO
logging.level.com.dekraChallenge.dekra_challenge=INFO
logging.level.org.springframework.security=INFO

# Swagger
springdoc.swagger-ui.url=/openapi.yaml
springdoc.api-docs.enabled=true

# TAX type
app.tax.type=ITBIS

# JWT
app.security.jwt.issuer=dekra-challenge
app.security.jwt.expiration-seconds=3600
# Provide APP_SECURITY_JWT_SECRET externally.
