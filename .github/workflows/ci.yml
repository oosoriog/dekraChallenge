name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build, test & coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Compiles, runs OpenAPI codegen, all tests, and enforces the JaCoCo
      # 80% line + 80% branch coverage gate (jacoco:check is bound to `verify`).
      - name: Build, test and verify coverage
        run: ./mvnw -B -ntp clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

  docker-image:
    name: Build Docker image (no push)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Builds the runtime image to prove the Dockerfile works in CI.
      # The image is NOT pushed to any registry (no deployment in scope).
      - name: Build image
        run: docker build -t dekra-challenge:ci .
